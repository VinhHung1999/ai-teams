const Avatar = ({ kind, sm, status, large }) => (
  <div className={`avatar avatar-${kind} ${sm ? 'avatar-sm' : ''} ${large ? 'avatar-lg' : ''}`}>
    {kind === 'team' ? <Ic d={I.layers} size={sm ? 16 : large ? 36 : 22}/> :
     kind === 'ME' ? 'H' : kind}
    {status && <span className={`online-dot ${status === 'thinking' ? 'thinking' : ''}`}/>}
  </div>
);

const ChatItem = ({ c, active, onClick }) => {
  const avatarKind = c.isBot ? 'ME' : 'team';
  return (
    <button className={`chat-item ${active ? 'active' : ''}`} onClick={onClick}>
      <Avatar kind={avatarKind}/>
      <div className="chat-meta">
        <div className="chat-row1">
          <span className="chat-name">{c.name}</span>
          {c.read && <Ic d={I.doubleCheck} size={14} className="read-tick"/>}
          <span className="chat-time">{c.time}</span>
        </div>
        <div className="chat-row2">
          <span className="preview">
            {c.from && c.from !== 'me' && c.from !== 'bot' && <span className="from">{c.from}: </span>}{c.last}
          </span>
          {c.pinned && !c.unread ? <Ic d={I.pin} size={14} className="pin-icon"/> : null}
          {c.unread > 0 && <span className="badge-count">{c.unread}</span>}
        </div>
      </div>
    </button>
  );
};

const Bubble = ({ m, mine }) => {
  const tail = mine ? 'tail-me' : (!m.same ? 'tail-them' : '');
  return (
    <div className={`msg-row ${mine ? 'me' : ''} ${m.same ? 'same' : ''}`}>
      {!mine && <Avatar kind={m.from} sm/>}
      <div className={`bubble ${tail}`}>
        {!mine && !m.same && <div className="bubble-author" style={{color: `var(--role-${m.from})`}}>{ROLE[m.from] || m.from}</div>}
        {m.text && <div className="bubble-text">{m.text}</div>}
        {m.kind === 'code' && (
          <div className="code-block">
            {m.lang && <div className="lang">{m.lang}</div>}
            {m.code}
          </div>
        )}
        {m.kind === 'task' && (
          <div className="task-card-inline">
            <div className="id-row">
              <span style={{background: PRIO_C[m.task.prio], color: 'white', padding: '0 6px', borderRadius: 4, fontWeight: 600}}>{m.task.prio}</span>
              <span className="id">{m.task.id}</span>
              <span>{m.task.pts}pt</span>
            </div>
            <div className="title">{m.task.title}</div>
            <div className="meta">
              <span className="status-chip" style={{background: `var(--role-${m.task.role})22`, color: `var(--role-${m.task.role})`}}>{m.task.role}</span>
            </div>
          </div>
        )}
        {m.actions && (
          <div className="bubble-actions">
            {m.actions.map((a, i) => <button key={i} className={`action-btn ${i === 0 ? 'primary' : ''}`}>{a}</button>)}
          </div>
        )}
        {m.reactions && (
          <div className="reactions">
            {m.reactions.map((r, i) => <span key={i} className="reaction">{r.emo} {r.n}</span>)}
          </div>
        )}
        <span className="bubble-meta">
          {m.time}
          {mine && <Ic d={I.doubleCheck} size={14} className="tick"/>}
        </span>
      </div>
    </div>
  );
};

function App() {
  const [t, setT] = useTweaks(/*EDITMODE-BEGIN*/{"theme":"light"}/*EDITMODE-END*/);
  uE(() => { document.documentElement.setAttribute('data-theme', t.theme); }, [t.theme]);

  const [activeId, setActiveId] = uS('team-aiteams');
  const [topic, setTopic] = uS('TL'); // 'PO' | 'TL' | 'BE' | 'FE' | 'QA'
  const [composer, setComposer] = uS('');
  const [showInfo, setShowInfo] = uS(false);
  const [showAttach, setShowAttach] = uS(false);
  const [infoTab, setInfoTab] = uS('overview');
  const [mobileView, setMobileView] = uS('list'); // 'list' | 'chat'
  const messagesRef = uR(null);

  const active = TEAMS.find(c => c.id === activeId);
  const teamMsgs = MESSAGES[activeId] || {};
  const msgs = teamMsgs[topic] || teamMsgs.all || [];

  uE(() => {
    if (messagesRef.current) messagesRef.current.scrollTop = messagesRef.current.scrollHeight;
  }, [activeId, topic]);

  uE(() => {
    const onClick = (e) => {
      if (!e.target.closest('.attach-menu') && !e.target.closest('.attach-trigger')) setShowAttach(false);
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);

  const showSlash = composer.startsWith('/');
  const isTeam = active && !active.isBot;
  const composeTarget = isTeam ? ROLE[topic] : active?.name;
  // First agent for default topic when switching teams
  const firstAgent = (team) => team && team.agents ? Object.keys(team.agents)[0] : null;

  return (
    <div className="app" data-mobile-view={mobileView}>
      <aside className="list">
        <div className="list-head">
          <button className="menu-btn"><Ic d={I.menu}/></button>
          <div className="search-box">
            <Ic d={I.search} size={18}/>
            <input placeholder="Search"/>
          </div>
        </div>
        <div className="chats">
          {TEAMS.map(c => <ChatItem key={c.id} c={c} active={activeId===c.id} onClick={()=>{
            setActiveId(c.id);
            setTopic(firstAgent(c) || 'all');
            setShowInfo(false);
            setMobileView('chat');
          }}/>)}
        </div>
      </aside>

      <main className="chat">
        {active && (
          <>
            <div className="chat-header">
              <button className="back-btn" onClick={()=>setMobileView('list')}>
                <Ic d={I.back || '<path d=\"M19 12H5\"/><path d=\"M12 19l-7-7 7-7\"/>'} size={22}/>
              </button>
              <Avatar kind={active.isBot ? 'ME' : 'team'} sm/>
              <div className="who" onClick={()=>setShowInfo(!showInfo)}>
                <div className="name">{active.name}</div>
                <div className="sub">{active.sub}</div>
              </div>
              <button className="icon-btn" title="Search"><Ic d={I.search} size={20}/></button>
              <button className="icon-btn" title="Info" onClick={()=>setShowInfo(!showInfo)}><Ic d={I.more} size={20}/></button>
            </div>

            {/* Topic switcher: pick which agent to talk to */}
            {isTeam && (
              <div className="topic-bar">
                {ROLES.filter(r => active.agents && active.agents[r]).map(r => {
                  const a = active.agents[r];
                  return (
                    <button key={r} className={`topic ${topic===r?'active':''}`} onClick={()=>setTopic(r)}>
                      <Avatar kind={r} sm status={a.status === 'online' || a.status === 'thinking' ? a.status : null}/>
                      <div className="topic-meta">
                        <div className="topic-name">{ROLE[r]}</div>
                        <div className={`topic-sub ${a.status === 'online' || a.status === 'thinking' ? 'online' : ''}`}>{a.sub}</div>
                      </div>
                    </button>
                  );
                })}
              </div>
            )}

            {isTeam && (
              <div className="pin-strip" onClick={()=>setShowInfo(true)}>
                <div className="pin-strip-bar"/>
                <div className="pin-strip-content">
                  <div className="pin-strip-title">{active.sprint}</div>
                  <div className="pin-strip-text">{active.sprintSub}</div>
                </div>
                <Ic d={I.pin} size={18} className="pin-icon"/>
              </div>
            )}

            <div className="messages" ref={messagesRef}>
              <div className="messages-inner">
                {msgs.length === 0 ? (
                  <div className="empty-topic">
                    <Avatar kind={topic} large/>
                    <div className="empty-title">No messages yet</div>
                    <div className="empty-sub">Start a conversation with {ROLE[topic]}</div>
                  </div>
                ) : msgs.map((m, i) => {
                  if (m.kind === 'day') return <div key={i} className="day-sep">{m.text}</div>;
                  if (m.kind === 'sys') return <div key={i} className="sys-msg">{m.text}</div>;
                  return <Bubble key={i} m={m} mine={m.from === 'me'}/>;
                })}
              </div>
            </div>

            {showSlash && (
              <div className="slash-hints">
                {[['/status','Show current status'],['/assign','Assign task'],['/move','Move task to column'],['/sprint','Sprint summary']].map(([c,d]) => (
                  <div key={c} className="slash-hint" onClick={()=>setComposer(c+' ')}>
                    <span className="cmd">{c}</span>
                    <span className="desc">{d}</span>
                  </div>
                ))}
              </div>
            )}

            {showAttach && (
              <div className="attach-menu">
                {[
                  ['file', 'File', I.file, '#3b82f6'],
                  ['image', 'Photo or video', I.image, '#10b981'],
                  ['task', 'Task card', I.task, '#a78bfa'],
                  ['poll', 'Poll', I.poll, '#f59e0b'],
                  ['link', 'Link / PR', I.link, '#ec4899'],
                ].map(([k, label, icon, color]) => (
                  <button key={k} className="attach-item" onClick={()=>setShowAttach(false)}>
                    <span className="attach-icon" style={{background: color}}><Ic d={icon} size={18}/></span>
                    <span>{label}</span>
                  </button>
                ))}
              </div>
            )}

            <div className="composer">
              <button className="comp-menu-pill">
                <Ic d={I.menu} size={20}/>
                <span>Menu</span>
              </button>
              <button className="comp-side-btn attach-trigger" onClick={(e)=>{e.stopPropagation(); setShowAttach(s=>!s);}}>
                <Ic d={I.paperclip} size={20}/>
              </button>
              <div className="composer-field">
                <textarea
                  value={composer}
                  onChange={e=>{
                    setComposer(e.target.value);
                    e.target.style.height = 'auto';
                    e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
                  }}
                  placeholder="Tin nhắn"
                  rows={1}
                />
                <button className="field-icon-btn"><Ic d={I.clock} size={20}/></button>
              </div>
              <button className={`comp-side-btn ${composer.trim() ? 'send-active' : ''}`}>
                <Ic d={composer.trim() ? I.send : I.mic} size={composer.trim() ? 20 : 22}/>
              </button>
            </div>

            <div className={`info-panel ${showInfo ? 'open' : ''}`} style={{display: showInfo ? 'flex' : 'none'}}>
              <div className="info-head">
                <button className="icon-btn" onClick={()=>setShowInfo(false)}><Ic d={I.x} size={20}/></button>
                <div className="title">Project Info</div>
                <button className="icon-btn"><Ic d={I.edit} size={18}/></button>
              </div>

              <div className="info-hero">
                <Avatar kind={active.isBot ? 'ME' : 'team'} large/>
                <div className="info-name">{active.name}</div>
                <div className="info-sub">{active.sub}</div>
              </div>

              <div className="info-tabs">
                {[['overview','Overview'],['files','Files'],['members','Agents']].map(([k,l]) => (
                  <button key={k} className={`info-tab ${infoTab===k?'active':''}`} onClick={()=>setInfoTab(k)}>{l}</button>
                ))}
              </div>

              <div className="info-body">
                {infoTab === 'overview' && isTeam && (
                  <>
                    <div className="info-section">
                      <div className="lbl">Sprint Board</div>
                      {Object.entries(BOARD_MINI).map(([col, items]) => (
                        <div key={col} className="mini-col">
                          <div className="mini-col-head">{col} <span className="count">{items.length}</span></div>
                          {items.map(it => (
                            <div key={it.id} className="mini-card">
                              <div className="mini-card-row">
                                <span className="mono mini-id">{it.id}</span>
                                <span className="prio-tag" style={{background: PRIO_C[it.prio]}}>{it.prio}</span>
                              </div>
                              <div>{it.title}</div>
                              <div className="meta">
                                <span className="status-chip" style={{background:`var(--role-${it.role})22`, color:`var(--role-${it.role})`}}>{it.role}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      ))}
                    </div>
                  </>
                )}

                {infoTab === 'files' && (
                  <div className="info-section">
                    <div className="lbl">Files · {FILES_MOCK.length}</div>
                    {FILES_MOCK.map((f, i) => (
                      <div key={i} className="file-row">
                        <FileIcon kind={f.kind}/>
                        <div className="file-meta">
                          <div className="file-name">{f.name}</div>
                          <div className="file-sub">{f.size} · from {f.from} · {f.time}</div>
                        </div>
                        <button className="icon-btn"><Ic d={I.download} size={16}/></button>
                      </div>
                    ))}
                  </div>
                )}

                {infoTab === 'members' && isTeam && (
                  <div className="info-section">
                    <div className="lbl">Agents · {Object.keys(active.agents || {}).length}</div>
                    {Object.entries(active.agents || {}).map(([r, a]) => (
                      <button key={r} className="member-row" onClick={()=>{setTopic(r); setShowInfo(false);}}>
                        <Avatar kind={r} sm status={a.status === 'online' || a.status === 'thinking' ? a.status : null}/>
                        <div style={{flex:1, textAlign:'left'}}>
                          <div className="name">{ROLE[r]}</div>
                          <div className={`role-sub ${a.status === 'online' || a.status === 'thinking' ? 'online' : ''}`}>{a.sub}</div>
                        </div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </>
        )}
      </main>

      <TweaksPanel>
        <TweakSection label="Theme"/>
        <TweakRadio label="Mode" value={t.theme} options={['light','dark']} onChange={v=>setT('theme',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
